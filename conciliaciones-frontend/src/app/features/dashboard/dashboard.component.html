<app-page-header title="Dashboard" subtitle="Resumen ejecutivo" />

<section class="dashboard-charts">
  <app-donut-summary-chart
    title="Número de archivos cargados"
    subtitle="Distribución por estado"
    icon="description"
    iconTone="blue"
    [items]="fileChartItems"
    [loading]="loading"
    [errorMessage]="fileChartError">
  </app-donut-summary-chart>

  <app-donut-summary-chart
    title="# Pólizas"
    subtitle="Distribución por estado"
    icon="shield"
    iconTone="green"
    [items]="policyChartItems"
    [loading]="loading"
    [errorMessage]="policyChartError">
  </app-donut-summary-chart>

  <app-donut-summary-chart
    title="# Casos de conciliación"
    subtitle="Distribución por estado"
    icon="rule"
    iconTone="orange"
    [items]="reconciliationCaseChartItems"
    [loading]="loading"
    [errorMessage]="reconciliationCaseChartError">
  </app-donut-summary-chart>
</section>
