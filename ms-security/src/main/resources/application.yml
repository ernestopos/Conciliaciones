server:
  port: 9081

spring:
  main:
    banner-mode: console
  application:
    name: ms-security

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/conciliaciones_db}
    username: ${SPRING_DATASOURCE_USERNAME:conci001}
    password: ${SPRING_DATASOURCE_PASSWORD:conci001}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SECURITY_JWT_ISSUER_URI:http://localhost:8081/realms/conciliaciones}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

security:
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:conciliaciones}
    client-id: ${KEYCLOAK_CLIENT_ID:admin-cli}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:conciliaciones-security-admin}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:kptwXq4oZO6KQddZngnRH2cXO4mo6rtc}
    client-secret:
    admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin123}
  secure-browser:
    idp-initiated-url: ${SECURE_BROWSER_IDP_INITIATED_URL:https://nexcoverin.com/realms/conciliaciones/protocol/saml/clients/trust-connection}
    portal-url: ${SECURE_BROWSER_PORTAL_URL:https://b8da6a7c-d4e9-4bf0-9b02-078c64f75323.workspaces-web.com}
    deep-links-enabled: ${SECURE_BROWSER_DEEP_LINKS_ENABLED:false}